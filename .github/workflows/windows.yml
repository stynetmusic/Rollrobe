# Один 32-битный exe для Windows 7 и новее: на 64-битной системе он тоже запускается.
# Python 3.8 — последняя версия с поддержкой Windows 7.
# PyInstaller 6 эту систему уже не поддерживает, поэтому зафиксирована 5.13.2.
name: Windows exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x86
      - run: python -c "import struct, sys; bits = struct.calcsize('P') * 8; print(sys.version); assert bits == 32, bits"
      - run: pip install -r requirements.txt pyinstaller==5.13.2
      - run: pyinstaller --noconfirm --windowed --onefile --name Rollrobe --collect-all customtkinter --add-data "ПГИ-06-12-2024.xlsx;." --add-data "ПГИ-16.09.2024.xlsx;." --add-data "ПГИ-16.09.2024-42.xlsx;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rollrobe-windows-x86
          path: dist/Rollrobe.exe
